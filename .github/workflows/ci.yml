name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The locked environment targets CUDA builds of PyTorch. The runner has no
      # GPU, so declare the virtual package; tests and the smoke run use the CPU.
      CONDA_OVERRIDE_CUDA: "12.8"
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.79.0
          cache: true

      - name: Run tests
        run: pixi run test

      - name: Smoke workflow
        run: pixi run smoke
