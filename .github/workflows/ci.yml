name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.79.0
          cache: true

      - name: Run tests
        run: pixi run test

      - name: Smoke workflow
        run: pixi run smoke
